app = "pg-mana"
primary_region = "iad"

[env]
  PORT = "8080"
  DEMO_MODE = "false"
  REQUIRE_STRIPE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
