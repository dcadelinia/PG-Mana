app = "pg-mana"
primary_region = "iad"

[env]
  PORT = "8080"
  DEMO_MODE = "true"
  REQUIRE_STRIPE = "false"
  API_KEY_PREFIX = "mana_live_"
  MAX_DEMO_POINTS = "100000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
